[project]
name = "dbms_backend"
version = "0.0.1"
description = "FastAPI project using uv"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "psycopg[binary]>=3.3.2",
    "pydantic-settings>=2.4.0",
    "python-dotenv>=1.2.1",
    "sqlalchemy>=2.0",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "black",
    "isort",
]

